name: Build Radxa CM5 uConsole Images

# Manual trigger - build kernel and selected image(s)
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version suffix (e.g., 1, 2, 3...)'
        required: true
        default: '1'
        type: string
      build_target:
        description: 'Image to build'
        required: true
        type: choice
        options:
          - kernel
          - all
          - debian
          - kali
          - retropie
        default: 'debian'
      reuse_kernel_run_id:
        description: 'Successful prior run ID containing kernel-build artifact (optional)'
        required: false
        default: ''
        type: string

env:
  ARCH: arm64
  DEBIAN_FRONTEND: noninteractive
  # June 2026 Radxa/uConsole refresh. Pin exact source for reproducibility.
  KERNEL_BRANCH: d142501df0e913a68f71d06fc2f0cb01b6e9373e
  OVERLAYS_REPO: dev-null2019/radxa-cm5-uconsole
  OVERLAYS_REF: c2204834e1d7d0acfd64e1b7874d432bc142f1a4
  KERNEL_REPO: ak-rex/ClockworkRadxa-linux
  AIOV2_CTL_REPO: hackergadgets/aiov2_ctl
  AIOV2_CTL_REF: c21ca742775b32ecea30b334e15a2d7f003e511a
  DEBIAN_IMAGE_SIZE_GIB: 12

jobs:
  # ============================================================
  # JOB 1: Build kernel once, use for all distros
  # ============================================================
  build-kernel:
    if: ${{ inputs.reuse_kernel_run_id == '' }}
    runs-on: ubuntu-22.04
    outputs:
      kernel_version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            device-tree-compiler u-boot-tools dwarves git wget xz-utils kmod cpio

      - name: Install cross-compiler
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          sudo tar -xf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C /opt/
          echo "/opt/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: build/kernel

      - name: Checkout overlays
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OVERLAYS_REPO }}
          ref: ${{ env.OVERLAYS_REF }}
          path: build/overlays

      - name: Build kernel and overlays
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          export KERNEL_VERSION="${{ inputs.kernel_version }}"

          # Run the build script
          ./scripts/build-kernel-ci.sh

      - name: Package artifacts
        run: |
          mkdir -p kernel-packages overlays
          cp build/output/kernel-packages/*.deb kernel-packages/
          cp build/output/overlays/*.dtbo overlays/

      - name: Set kernel version output
        id: set-version
        run: echo "version=${{ inputs.kernel_version }}" >> "$GITHUB_OUTPUT"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            kernel-packages/
            overlays/
          retention-days: 7

  # ============================================================
  # JOB 2: Build Debian image
  # ============================================================
  build-debian:
    needs: build-kernel
    if: >-
      ${{
        always() &&
        (inputs.build_target == 'debian' || inputs.build_target == 'all') &&
        (needs.build-kernel.result == 'success' || inputs.reuse_kernel_run_id != '')
      }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout image customizations
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils kmod cpio rsync dosfstools parted gdisk \
            cloud-guest-utils qemu-user-static binfmt-support pixz gcc device-tree-compiler

      - name: Checkout pinned overlays
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OVERLAYS_REPO }}
          ref: ${{ env.OVERLAYS_REF }}
          path: overlay-source

      - name: Checkout pinned HackerGadgets AIO2 controller
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AIOV2_CTL_REPO }}
          ref: ${{ env.AIOV2_CTL_REF }}
          path: aiov2-source

      - name: Compile pinned overlays
        run: |
          mkdir -p compiled_overlays
          for dts in overlay-source/devicetree_overlays/*.dts; do
            basename=$(basename "$dts" .dts)
            gcc -E -nostdinc -Ioverlay-source/devicetree_overlays \
              -undef -D__DTS__ -x assembler-with-cpp "$dts" | \
              dtc -@ -I dts -O dtb -o "compiled_overlays/${basename}.dtbo" -
          done
          gcc -E -nostdinc -Ioverlay-source/devicetree_overlays \
            -undef -D__DTS__ -x assembler-with-cpp scripts/dts/aio2_radxa_rails.dts | \
            dtc -@ -I dts -O dtb -o compiled_overlays/aio2_radxa_rails.dtbo -
          test "$(find compiled_overlays -maxdepth 1 -type f -name '*.dtbo' | wc -l)" -eq 4

      - name: Download current-run kernel artifacts
        if: ${{ inputs.reuse_kernel_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-build

      - name: Download verified prior-run kernel artifacts
        if: ${{ inputs.reuse_kernel_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-build
          run-id: ${{ inputs.reuse_kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base image
        run: |
          wget -O debian.img.xz https://github.com/radxa-build/radxa-cm5-rpi-cm4-io/releases/download/rsdk-b3/radxa-cm5-rpi-cm4-io_bookworm_cli_b3.output.img.xz
          echo '7a69bff7aaa283ed6c31090dddd6b30456069547a5c8fb9f3c22673d9944065c806b448be79beb90a94046cdb8756d74195a708d4db55d8d2b3ae08d5c6808c7  debian.img.xz' | sha512sum -c -
          xz -d debian.img.xz

      - name: Mount and modify image
        run: |
          trap 'rc=$?; printf "::error::image assembly failed at line %s: %s (rc=%s)\n" "$LINENO" "$BASH_COMMAND" "$rc"; exit "$rc"' ERR
          test "$(git -C aiov2-source rev-parse HEAD)" = "${AIOV2_CTL_REF}"
          truncate -s "${DEBIAN_IMAGE_SIZE_GIB}G" debian.img
          export LOOP_DEVICE
          LOOP_DEVICE=$(sudo losetup --find --show --partscan debian.img)
          echo "Loop device: $LOOP_DEVICE"

          # Move the backup GPT, grow only the root partition, then expand its
          # ext4 filesystem. The 12-GiB image is well below the detected
          # 488,554,496-sector (~233-GiB) CM5 eMMC.
          sudo sgdisk -e "$LOOP_DEVICE"
          sudo growpart "$LOOP_DEVICE" 3
          sudo partprobe "$LOOP_DEVICE"
          sudo udevadm settle
          sudo e2fsck -f -y "${LOOP_DEVICE}p3" || test "$?" -eq 1
          sudo resize2fs "${LOOP_DEVICE}p3"

          # rsdk-b3 uses p1=config (FAT16), p2=efi (FAT16), p3=rootfs
          # (ext4). Probe filesystems directly: lsblk's udev-backed LABEL can
          # still be blank immediately after losetup -P on hosted runners.
          assert_partition() {
            local device="$1" expected_label="$2" expected_type="$3"
            local actual_label actual_type
            actual_label=$(sudo blkid -p -s LABEL -o value "$device")
            actual_type=$(sudo blkid -p -s TYPE -o value "$device")
            printf '%s label=%s type=%s\n' "$device" "$actual_label" "$actual_type"
            test "$actual_label" = "$expected_label"
            test "$actual_type" = "$expected_type"
          }
          assert_partition "${LOOP_DEVICE}p1" config vfat
          assert_partition "${LOOP_DEVICE}p2" efi vfat
          assert_partition "${LOOP_DEVICE}p3" rootfs ext4

          mkdir -p ./mnt/{config,root}
          sudo mount ${LOOP_DEVICE}p1 ./mnt/config
          sudo mount ${LOOP_DEVICE}p3 ./mnt/root
          # Radxa rsdk-b3 keeps kernel/extlinux in rootfs:/boot. p2 is the
          # separate EFI filesystem mounted by fstab at /boot/efi, not /boot.
          sudo mkdir -p ./mnt/root/boot/efi

          # Keep remote recovery available on the first normal boot. The stock
          # config script otherwise disables ssh unless its headless heuristic
          # succeeds, which is unsuitable while validating a new panel kernel.
          sudo sed -i -E \
            '/^disable_service[[:space:]]+ssh([.]socket)?$/d; s/^if[[:space:]]+headless[[:space:]]+enable_service[[:space:]]+ssh$/enable_service ssh/' \
            ./mnt/config/before.txt
          sudo grep -qxF 'enable_service ssh' ./mnt/config/before.txt || \
            printf '%s\n' 'enable_service ssh' | sudo tee -a ./mnt/config/before.txt >/dev/null

          # Some third-party package scripts compile against /proc/cpuinfo and
          # require a PTY. Bind only proc/dev; never bind /run, which could let
          # chrooted systemctl reach the runner's systemd.
          sudo mount -t proc proc ./mnt/root/proc
          sudo mount --rbind /dev ./mnt/root/dev
          sudo mount --make-rslave ./mnt/root/dev

          # Verify mount and create tmp directory
          ls -la ./mnt/root/ || true
          sudo mkdir -p ./mnt/root/tmp

          # Install target-only helpers. These scripts are copied into the image;
          # they are never executed on the GitHub runner or operator workstation.
          sudo install -D -m 0755 scripts/target/uconsole-bootstrap-nvme-root \
            ./mnt/root/usr/local/sbin/uconsole-bootstrap-nvme-root
          sudo install -D -m 0755 scripts/target/uconsole-install-hackergadgets \
            ./mnt/root/usr/local/sbin/uconsole-install-hackergadgets
          sudo install -D -m 0755 scripts/target/uconsole-validate-hardware \
            ./mnt/root/usr/local/sbin/uconsole-validate-hardware
          sudo install -D -m 0755 scripts/target/pinctrl \
            ./mnt/root/usr/local/bin/pinctrl
          sudo install -d -m 0755 ./mnt/root/opt/hackergadgets
          sudo rsync -a aiov2-source/ ./mnt/root/opt/hackergadgets/aiov2_ctl/

          # Configure AK-Rex's signed ARM repository without running its board
          # maintainer scripts during image assembly.
          wget -q -O ak-rex-key.asc \
            https://raw.githubusercontent.com/ak-rex/akrex-arm-repo/main/debian/KEY.gpg
          echo '842f9fee1af93ec9fc5c45c5471f8d1ef7be605f35e458eca64d6dcc1699b206  ak-rex-key.asc' | sha256sum -c -
          gpg --batch --dearmor --output ak-rex.gpg ak-rex-key.asc
          install -d -m 0700 "$RUNNER_TEMP/ak-rex-gnupg"
          gpg --batch --no-options --homedir "$RUNNER_TEMP/ak-rex-gnupg" \
            --show-keys --with-colons ak-rex.gpg \
            > ak-rex-key-info
          AK_REX_FINGERPRINT=$(awk -F: '$1 == "fpr" { print $10; exit }' ak-rex-key-info)
          rm -f ak-rex-key-info
          printf 'AK-Rex signing-key fingerprint: %s\n' "$AK_REX_FINGERPRINT"
          test "$AK_REX_FINGERPRINT" = '5799BD7F376D1011C510B036B40C8F551C4AB897'
          echo 'Repository gate: install AK-Rex key'
          sudo install -D -m 0644 ak-rex.gpg ./mnt/root/usr/share/keyrings/ak-rex.gpg
          echo 'Repository gate: write AK-Rex source'
          echo 'deb [arch=arm64 signed-by=/usr/share/keyrings/ak-rex.gpg] https://raw.githubusercontent.com/ak-rex/akrex-arm-repo/main/debian stable main' | \
            sudo tee ./mnt/root/etc/apt/sources.list.d/ak-rex.list >/dev/null
          echo 'Repository gate: write Debian firmware sources'
          { \
            echo 'deb http://deb.debian.org/debian bookworm non-free-firmware'; \
            echo 'deb http://deb.debian.org/debian bookworm-updates non-free-firmware'; \
            echo 'deb http://security.debian.org/debian-security bookworm-security non-free-firmware'; \
          } | sudo tee ./mnt/root/etc/apt/sources.list.d/uconsole-firmware.list >/dev/null
          echo 'Repository gate: validate Debian firmware sources'
          sudo test -s ./mnt/root/etc/apt/sources.list.d/uconsole-firmware.list
          sudo grep -q 'non-free-firmware' \
            ./mnt/root/etc/apt/sources.list.d/uconsole-firmware.list
          echo 'Repository gate: complete'

          # Chroot cannot use the image's systemd-resolved symlink. Preserve it,
          # install the runner's working resolver for package fetches, then
          # restore the original image resolver before publishing.
          if [ -e ./mnt/root/etc/resolv.conf ] || [ -L ./mnt/root/etc/resolv.conf ]; then
            sudo cp -a ./mnt/root/etc/resolv.conf ./mnt/root/etc/resolv.conf.image-build
          fi
          sudo cp --remove-destination /etc/resolv.conf ./mnt/root/etc/resolv.conf

          # Never start target services during offline assembly. This guard and
          # every package/controller command below exist strictly in the arm64
          # image chroot, never on the GitHub runner or operator workstation.
          cat <<'EOF' | sudo tee ./mnt/root/usr/sbin/policy-rc.d >/dev/null
          #!/bin/sh
          exit 101
          EOF
          sudo chmod 0755 ./mnt/root/usr/sbin/policy-rc.d

          # Third-party maintainer scripts assume a live login and systemd.
          # Divert their real tools strictly inside the mounted ARM image. /run
          # is never host-bound, and every temporary file is removed below.
          TARGET_USER=$(awk -F: '$3 == 1000 { print $1; exit }' ./mnt/root/etc/passwd)
          TARGET_USER=${TARGET_USER:-root}
          [[ $TARGET_USER =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf 'Offline package identity: %s\n' "$TARGET_USER"
          if [ "$TARGET_USER" = root ] && [ ! -e ./mnt/root/home/root ]; then
            sudo ln -s /root ./mnt/root/home/root
          fi
          sudo chroot ./mnt/root dpkg-divert --quiet --local --rename --add /usr/bin/logname
          printf '#!/bin/sh\nprintf "%%s\\n" %q\n' "$TARGET_USER" | \
            sudo tee ./mnt/root/usr/bin/logname >/dev/null
          sudo chmod 0755 ./mnt/root/usr/bin/logname
          sudo install -d -m 0755 ./mnt/root/run/readsb
          printf '{"now":0,"messages":0,"aircraft":[]}\n' | \
            sudo tee ./mnt/root/run/readsb/aircraft.json >/dev/null
          sudo install -d -m 0755 ./mnt/root/boot/firmware
          printf '\n' | sudo tee ./mnt/root/boot/firmware/cmdline.txt >/dev/null

          # Stage overlays before kernel hooks generate extlinux.conf. U-Boot
          # scans rootfs:/boot, so preserve root-relative /boot paths and the
          # kernel package's fdtdir entry for the CM5 base device tree.
          sudo mkdir -p ./mnt/root/boot/dtbo
          sudo install -m 0644 compiled_overlays/*.dtbo ./mnt/root/boot/dtbo/
          sudo sed -i -E '/^[[:space:]]*U_BOOT_FDT_OVERLAYS(_DIR)?=/d' \
            ./mnt/root/etc/default/u-boot
          cat <<'EOF' | sudo tee -a ./mnt/root/etc/default/u-boot >/dev/null
          U_BOOT_FDT_OVERLAYS="axp20x.dtbo cwu50_panel.dtbo displaystuff.dtbo aio2_radxa_rails.dtbo"
          U_BOOT_FDT_OVERLAYS_DIR="/boot/dtbo/"
          EOF

          # Install kernel
          mapfile -t KERNEL_IMAGE_DEBS < <(
            find kernel-packages -maxdepth 1 -type f -name 'linux-image-*.deb' ! -name '*-dbg_*' -print
          )
          test "${#KERNEL_IMAGE_DEBS[@]}" -eq 1
          sudo install -m 0644 "${KERNEL_IMAGE_DEBS[0]}" ./mnt/root/tmp/
          sudo chroot ./mnt/root /bin/bash -c "
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            cd /tmp
            dpkg -i linux-image-*.deb || apt-get install -f -y --no-upgrade
            rm -f /tmp/linux-image-*.deb
            apt-get clean
            apt-get update
            apt-get install -y --no-upgrade \
              gdisk parted e2fsprogs rsync nvme-cli smartmontools pciutils usbutils i2c-tools \
              iw wireless-tools wpasupplicant rfkill firmware-mediatek rtl-sdr \
              rtl-433 gpsd gpsd-clients openssh-server ca-certificates curl gnupg sudo git \
              podman gpiod pinctrl python3 python3-pyqt6 bash-completion
            apt-get install -y --no-upgrade python3-venv
            cd /opt/hackergadgets/aiov2_ctl
            python3 aiov2_ctl.py --install
            cat >/usr/local/share/aiov2_ctl/config.json <<'AIO2_EOF'
          {
            "rails_on_boot": {
              "GPS": false,
              "LORA": false,
              "SDR": true,
              "USB": true
            },
            "mesh_on_boot": false
          }
          AIO2_EOF
            /usr/local/bin/aiov2_ctl --add-apps
            apt-get install -y --install-recommends --no-upgrade \
              hackergadgets-uconsole-aio-board meshtastic-mui sdrpp-brown \
              tar1090 pygpsclient
            systemctl enable ssh
            systemctl enable aiov2-rails-boot.service
            systemctl disable meshtasticd.service 2>/dev/null || true
            install -d -m 0755 \
              /srv/shtf-box/packages /srv/shtf-box/data /srv/shtf-box/cache \
              /srv/shtf-box/models /srv/shtf-box/maps /srv/shtf-box/backups \
              /etc/shtf-box
            cat >/etc/shtf-box/storage.env <<'SHTF_EOF'
          SHTF_ROOT=/srv/shtf-box
          SHTF_DATA=/srv/shtf-box/data
          SHTF_CACHE=/srv/shtf-box/cache
          SHTF_MODELS=/srv/shtf-box/models
          SHTF_MAPS=/srv/shtf-box/maps
          SHTF_EOF
            rm -f /usr/sbin/policy-rc.d
            rm -f /run/readsb/aircraft.json /boot/firmware/cmdline.txt \
              /boot/firmware/cmdline.txtn /usr/bin/logname
            rmdir /boot/firmware 2>/dev/null || true
            dpkg-divert --quiet --rename --remove /usr/bin/logname
            apt-get clean
          "
          echo 'Image cleanup: chroot package cleanup complete'
          sudo umount -R ./mnt/root/dev
          sudo umount ./mnt/root/proc
          sudo rm -f ./mnt/root/etc/resolv.conf
          if [ -e ./mnt/root/etc/resolv.conf.image-build ] || [ -L ./mnt/root/etc/resolv.conf.image-build ]; then
            sudo mv ./mnt/root/etc/resolv.conf.image-build ./mnt/root/etc/resolv.conf
          fi

          # PyGPSClient's upstream installer creates only a per-user venv and
          # appends it to the interactive shell PATH. Provide the system-wide
          # command advertised by the HackerGadgets package without executing
          # target code on the runner.
          PYGPSCLIENT_VENV="/home/${TARGET_USER}/.pygpsclient/bin/pygpsclient"
          PYGPSCLIENT_IMAGE_PATH="./mnt/root${PYGPSCLIENT_VENV}"
          if [ "$TARGET_USER" = root ]; then
            # /home/root is an absolute target-side link to /root. Avoid
            # following that link into the GitHub runner's own /root here.
            PYGPSCLIENT_IMAGE_PATH=./mnt/root/root/.pygpsclient/bin/pygpsclient
          fi
          sudo test -x "$PYGPSCLIENT_IMAGE_PATH"
          sudo ln -sfn "$PYGPSCLIENT_VENV" ./mnt/root/usr/local/bin/pygpsclient

          for package in nvme-cli smartmontools firmware-mediatek rtl-sdr openssh-server \
            hackergadgets-uconsole-aio-board meshtastic-mui sdrpp-brown tar1090 \
            pygpsclient pinctrl gpiod python3-pyqt6 python3-venv podman; do
            printf 'Package assertion: %s\n' "$package"
            sudo chroot ./mnt/root dpkg-query -W -f='${db:Status-Abbrev}' "$package" | grep -qx 'ii '
          done
          FREE_KIB=$(df --output=avail -k ./mnt/root | tail -n 1 | xargs)
          printf 'Root filesystem free KiB: %s\n' "$FREE_KIB"
          test "$FREE_KIB" -ge 4194304

          # Static image contract: target helpers, signed repo, Wi-Fi firmware,
          # and boot files must exist before publishing.
          echo 'Static image assertions: begin'
          sudo test -x ./mnt/root/usr/local/sbin/uconsole-bootstrap-nvme-root
          sudo test -x ./mnt/root/usr/local/sbin/uconsole-install-hackergadgets
          sudo test -x ./mnt/root/usr/local/sbin/uconsole-validate-hardware
          sudo test -x ./mnt/root/usr/local/bin/aiov2_ctl
          sudo test -x ./mnt/root/usr/local/bin/pinctrl
          sudo test -L ./mnt/root/usr/local/bin/pygpsclient
          test "$(sudo readlink ./mnt/root/usr/local/bin/pygpsclient)" = "$PYGPSCLIENT_VENV"
          sudo test -x "$PYGPSCLIENT_IMAGE_PATH"
          sudo test -s ./mnt/root/usr/local/share/aiov2_ctl/config.json
          sudo test -s ./mnt/root/etc/systemd/system/aiov2-rails-boot.service
          sudo test -L ./mnt/root/etc/systemd/system/multi-user.target.wants/aiov2-rails-boot.service
          sudo test -s ./mnt/root/usr/share/keyrings/ak-rex.gpg
          sudo test -d ./mnt/root/lib/firmware/mediatek
          sudo test -d ./mnt/root/srv/shtf-box/packages
          sudo test -s ./mnt/root/etc/shtf-box/storage.env
          sudo test ! -e ./mnt/root/run/readsb/aircraft.json
          sudo test ! -e ./mnt/root/boot/firmware/cmdline.txt
          if [ "$TARGET_USER" = root ]; then
            test "$(sudo readlink ./mnt/root/home/root)" = /root
          fi
          sudo test -x ./mnt/root/usr/bin/logname
          sudo test -x ./mnt/root/usr/bin/systemctl
          sudo test ! -e ./mnt/root/usr/bin/logname.distrib
          sudo test ! -e ./mnt/root/usr/sbin/policy-rc.d
          sudo test "$(grep -cxF 'enable_service ssh' ./mnt/config/before.txt)" -eq 1
          sudo test "$(grep -Ec '^disable_service[[:space:]]+ssh([.]socket)?$' ./mnt/config/before.txt)" -eq 0
          sudo test -d ./mnt/root/boot/extlinux
          sudo grep -Eq '^[[:space:]]*linux /boot/vmlinuz-' \
            ./mnt/root/boot/extlinux/extlinux.conf
          sudo grep -Eq '^[[:space:]]*initrd /boot/initrd\.img-' \
            ./mnt/root/boot/extlinux/extlinux.conf
          sudo grep -Eq '^[[:space:]]*fdtdir /usr/lib/linux-image-' \
            ./mnt/root/boot/extlinux/extlinux.conf
          for overlay in axp20x.dtbo cwu50_panel.dtbo displaystuff.dtbo aio2_radxa_rails.dtbo; do
            sudo test -s "./mnt/root/boot/dtbo/$overlay"
            sudo grep -Eq "^[[:space:]]*fdtoverlays .* /boot/dtbo/$overlay([[:space:]]|$)" \
              ./mnt/root/boot/extlinux/extlinux.conf
          done
          echo 'Static image assertions: complete'

          sudo sync
          sudo umount ./mnt/config
          sudo umount ./mnt/root
          sudo losetup -d $LOOP_DEVICE

      - name: Cleanup mounts
        if: always()
        run: |
          sudo umount -R ./mnt/root/dev 2>/dev/null || true
          sudo umount ./mnt/root/proc 2>/dev/null || true
          sudo umount ./mnt/config 2>/dev/null || true
          sudo umount ./mnt/root 2>/dev/null || true
          LOOP_DEVICE=$(losetup -a | grep debian.img | cut -d: -f1 || true)
          if [ -n "$LOOP_DEVICE" ]; then
            sudo losetup -d $LOOP_DEVICE || true
          fi
          rm -rf ./mnt

      - name: Compress image
        run: |
          IMAGE_NAME="radxa-cm5-uconsole_debian_bookworm_kernel-${{ inputs.kernel_version }}_$(date +%Y%m%d).img"
          mv debian.img "$IMAGE_NAME"
          sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
          xz -z -9 -T$(nproc) "$IMAGE_NAME"
          sha256sum "${IMAGE_NAME}.xz" > "${IMAGE_NAME}.xz.sha256"
          echo "DEBIAN_IMAGE=${IMAGE_NAME}.xz" >> $GITHUB_ENV

      - name: Upload Debian image
        uses: actions/upload-artifact@v4
        with:
          name: debian-image
          path: |
            ${{ env.DEBIAN_IMAGE }}
            ${{ env.DEBIAN_IMAGE }}.sha256
            '*.img.sha256'
          retention-days: 30

  # ============================================================
  # JOB 3: Build Kali image
  # ============================================================
  build-kali:
    needs: build-kernel
    if: ${{ github.event.inputs.build_target == 'kali' || github.event.inputs.build_target == 'all' }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils kmod cpio rsync dosfstools parted qemu-user-static binfmt-support pixz debootstrap

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-build

      - name: Build Kali rootfs from Debian base
        run: |
          # Use Debian base and convert to Kali
          wget -O kali.img.xz https://github.com/radxa-build/radxa-cm5-rpi-cm4-io/releases/download/rsdk-b3/radxa-cm5-rpi-cm4-io_bookworm_cli_b3.output.img.xz
          xz -d kali.img.xz
          
          sudo losetup -fP kali.img
          export LOOP_DEVICE=$(losetup -a | grep kali.img | cut -d: -f1)
          echo "Loop device: $LOOP_DEVICE"

          mkdir -p ./mnt/{boot,root}
          sudo mount ${LOOP_DEVICE}p1 ./mnt/boot || true
          sudo mount ${LOOP_DEVICE}p2 ./mnt/root

          # Verify mount and create tmp directory
          sudo mkdir -p ./mnt/root/tmp

          # Install kernel
          sudo cp kernel-packages/*.deb ./mnt/root/tmp/
          
          # Configure Kali repos and install kernel
          sudo chroot ./mnt/root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            
            # Add Kali repos
            echo 'deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware' > /etc/apt/sources.list.d/kali.list
            
            # Add Kali GPG key (using modern method)
            wget -q -O /tmp/kali-archive-key.asc https://archive.kali.org/archive-key.asc
            gpg --dearmor < /tmp/kali-archive-key.asc > /etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
            rm /tmp/kali-archive-key.asc
            
            # Update and install kernel
            apt-get update || true
            cd /tmp
            dpkg -i linux-image-*.deb || true
            apt-get install -f -y
            rm -f /tmp/*.deb
            update-initramfs -u -k all
            
            # Install minimal Kali tools (optional, comment out to save space/time)
            # apt-get install -y kali-tools-top10
          "
          
          # Install overlays
          sudo mkdir -p ./mnt/boot/overlays
          sudo cp compiled_overlays/*.dtbo ./mnt/boot/overlays/ 2>/dev/null || true

          sudo sync
          sudo umount ./mnt/boot ./mnt/root
          sudo losetup -d $LOOP_DEVICE

      - name: Cleanup mounts
        if: always()
        run: |
          sudo umount ./mnt/boot ./mnt/root 2>/dev/null || true
          LOOP_DEVICE=$(losetup -a | grep kali.img | cut -d: -f1 || true)
          if [ -n "$LOOP_DEVICE" ]; then
            sudo losetup -d $LOOP_DEVICE || true
          fi
          rm -rf ./mnt

      - name: Compress image
        run: |
          IMAGE_NAME="radxa-cm5-uconsole_kali_kernel-${{ needs.build-kernel.outputs.kernel_version }}_$(date +%Y%m%d).img"
          mv kali.img "$IMAGE_NAME"
          xz -z -9 -T$(nproc) "$IMAGE_NAME"
          sha256sum "${IMAGE_NAME}.xz" > "${IMAGE_NAME}.xz.sha256"
          echo "KALI_IMAGE=${IMAGE_NAME}.xz" >> $GITHUB_ENV

      - name: Upload Kali image
        uses: actions/upload-artifact@v4
        with:
          name: kali-image
          path: |
            ${{ env.KALI_IMAGE }}
            ${{ env.KALI_IMAGE }}.sha256
          retention-days: 30

  # ============================================================
  # JOB 4: Build RetroPie image
  # ============================================================
  build-retropie:
    needs: build-kernel
    if: ${{ github.event.inputs.build_target == 'retropie' || github.event.inputs.build_target == 'all' }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils kmod cpio rsync dosfstools parted qemu-user-static binfmt-support pixz

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-build

      - name: Build RetroPie from base
        run: |
          # Start with Debian base, add RetroPie
          wget -O retropie.img.xz https://github.com/radxa-build/radxa-cm5-rpi-cm4-io/releases/download/rsdk-b3/radxa-cm5-rpi-cm4-io_bookworm_cli_b3.output.img.xz
          xz -d retropie.img.xz
          
          sudo losetup -fP retropie.img
          export LOOP_DEVICE=$(losetup -a | grep retropie.img | cut -d: -f1)
          echo "Loop device: $LOOP_DEVICE"

          mkdir -p ./mnt/{boot,root}
          sudo mount ${LOOP_DEVICE}p1 ./mnt/boot || true
          sudo mount ${LOOP_DEVICE}p2 ./mnt/root

          # Verify mount and create tmp directory
          sudo mkdir -p ./mnt/root/tmp

          # Install kernel
          sudo cp kernel-packages/*.deb ./mnt/root/tmp/

          # Install kernel and prepare for RetroPie
          sudo chroot ./mnt/root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            
            # Install kernel
            cd /tmp
            dpkg -i linux-image-*.deb || true
            apt-get install -f -y
            rm -f /tmp/*.deb
            update-initramfs -u -k all
            
            # Install RetroPie dependencies
            apt-get install -y git dialog unzip xmlstarlet python3-pip
            
            # Create RetroPie user
            useradd -m -G video,audio,input,dialout,plugdev -s /bin/bash retropie || true
            echo 'retropie:retropie' | chpasswd
            
            # Download RetroPie setup script (doesn't run full install to save time)
            cd /home/retropie
            git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git
            chown -R retropie:retropie RetroPie-Setup
            
            # Create placeholder - user runs setup on first boot
            echo '#!/bin/bash' > /home/retropie/install-retropie.sh
            echo 'cd /home/retropie/RetroPie-Setup' >> /home/retropie/install-retropie.sh
            echo 'sudo ./retropie_setup.sh' >> /home/retropie/install-retropie.sh
            chmod +x /home/retropie/install-retropie.sh
            chown retropie:retropie /home/retropie/install-retropie.sh
          "
          
          # Install overlays
          sudo mkdir -p ./mnt/boot/overlays
          sudo cp compiled_overlays/*.dtbo ./mnt/boot/overlays/ 2>/dev/null || true

          # Create first-boot message
          printf '%s\n' \
            '===========================================' \
            '  Radxa CM5 uConsole - RetroPie Edition' \
            '===========================================' \
            '' \
            'To complete RetroPie installation:' \
            '  1. Run: ./install-retropie.sh' \
            '  2. Select "Basic Install"' \
            '  3. Wait for installation to complete' \
            '  4. Reboot' \
            '' \
            'Default credentials:' \
            '  User: retropie' \
            '  Pass: retropie' \
            '' \
            '===========================================' \
            | sudo tee ./mnt/root/etc/motd > /dev/null

          sudo sync
          sudo umount ./mnt/boot ./mnt/root
          sudo losetup -d $LOOP_DEVICE

      - name: Cleanup mounts
        if: always()
        run: |
          sudo umount ./mnt/boot ./mnt/root 2>/dev/null || true
          LOOP_DEVICE=$(losetup -a | grep retropie.img | cut -d: -f1 || true)
          if [ -n "$LOOP_DEVICE" ]; then
            sudo losetup -d $LOOP_DEVICE || true
          fi
          rm -rf ./mnt

      - name: Compress image
        run: |
          IMAGE_NAME="radxa-cm5-uconsole_retropie_kernel-${{ needs.build-kernel.outputs.kernel_version }}_$(date +%Y%m%d).img"
          mv retropie.img "$IMAGE_NAME"
          xz -z -9 -T$(nproc) "$IMAGE_NAME"
          sha256sum "${IMAGE_NAME}.xz" > "${IMAGE_NAME}.xz.sha256"
          echo "RETROPIE_IMAGE=${IMAGE_NAME}.xz" >> $GITHUB_ENV

      - name: Upload RetroPie image
        uses: actions/upload-artifact@v4
        with:
          name: retropie-image
          path: |
            ${{ env.RETROPIE_IMAGE }}
            ${{ env.RETROPIE_IMAGE }}.sha256
          retention-days: 30

  # ============================================================
  # JOB 5: Create release summary
  # ============================================================
  create-release-notes:
    needs: [build-kernel]
    if: always()
    runs-on: ubuntu-22.04
    
    steps:
      - name: Generate release notes
        run: |
          BUILD_TARGET="${{ github.event.inputs.build_target }}"

          cat << EOF > release-notes.md
          # Radxa CM5 uConsole Build

          **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Kernel Version:** 6.1.x-${{ inputs.kernel_version }}
          **Kernel Source:** ClockworkRadxa-linux (linux-6.1-stan-rkr4.1)
          **Build Target:** ${BUILD_TARGET}

          ## Build Information

          This build includes the custom kernel and the following image(s):

          EOF

          # Add distro-specific info based on what was built
          if [ "$BUILD_TARGET" = "debian" ] || [ "$BUILD_TARGET" = "all" ]; then
            cat << 'EOF' >> release-notes.md
          ### Debian Bookworm (CLI)
          - Base system with minimal packages
          - Recommended for development and customization
          - **Use case:** General purpose, development, server
          - **Default credentials:** clockwork / clockwork

          EOF
          fi

          if [ "$BUILD_TARGET" = "kali" ] || [ "$BUILD_TARGET" = "all" ]; then
            cat << 'EOF' >> release-notes.md
          ### Kali Linux
          - Security-focused distribution
          - Kali repositories enabled (tools not pre-installed to save space)
          - **Use case:** Penetration testing, security research
          - **Note:** Run \`apt-get install kali-tools-top10\` for core tools
          - **Default credentials:** clockwork / clockwork (CHANGE IMMEDIATELY!)

          EOF
          fi

          if [ "$BUILD_TARGET" = "retropie" ] || [ "$BUILD_TARGET" = "all" ]; then
            cat << 'EOF' >> release-notes.md
          ### RetroPie
          - Retro gaming platform
          - RetroPie-Setup included (requires first-boot installation)
          - **Use case:** Portable gaming emulation
          - **Note:** Run \`./install-retropie.sh\` after first boot
          - **Default credentials:** retropie / retropie

          EOF
          fi

          cat << 'EOF' >> release-notes.md
          
          ## Hardware Support
          
          All images share the same kernel and support:
          - ✅ Display, Keyboard, USB, Power Management
          - ✅ 4G module, microSD card
          - ❌ WiFi/BT (hardware limitation - use USB dongles)
          
          ## Installation

          \`\`\`bash
          # Download image
          wget <image-url>

          # Verify checksum
          sha256sum -c <image>.sha256

          # Extract
          xz -d <image>.xz

          # Flash (replace /dev/sdX)
          sudo dd if=<image> of=/dev/sdX bs=4M status=progress
          sync
          \`\`\`

          ## Build Artifacts

          This build includes:
          - Kernel .deb packages (linux-image, linux-headers)
          - Device tree overlays (.dtbo)
          - Flashable image(s) (.img.xz) with SHA256 checksums

          ## Next Steps

          1. Download image and checksum from artifacts
          2. Verify checksum matches
          3. Flash to microSD card (8GB+ recommended)
          4. Boot in uConsole
          5. Change default password immediately
          6. Update system: \`sudo apt update && sudo apt upgrade\`
          7. For RetroPie: Run \`./install-retropie.sh\` as retropie user

          ---

          **Build Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30
